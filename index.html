<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="Lista de compras compartilhada em tempo real.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <title>Nossa Lista ❤️</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">LISTA COMPARTILHADA</span>
        <h1>Nossa Lista <span>❤️</span></h1>
        <p id="syncStatus" class="sync-status">Modo local</p>
      </div>
      <button id="clearDoneBtn" class="icon-btn" title="Limpar comprados">✓</button>
    </header>

    <main>
      <section class="add-card">
        <form id="itemForm">
          <div class="input-row">
            <input id="itemName" type="text" placeholder="O que precisamos comprar?" autocomplete="off" required>
            <button type="submit" class="add-btn">Adicionar</button>
          </div>
          <div class="form-options">
            <input id="quantity" type="text" placeholder="Qtd. (ex.: 2)" maxlength="20">
            <select id="category">
              <option value="Alimentos">🍎 Alimentos</option>
              <option value="Bebidas">🥤 Bebidas</option>
              <option value="Limpeza">🧹 Limpeza</option>
              <option value="Higiene">🧴 Higiene</option>
              <option value="Casa">🏠 Casa</option>
              <option value="Outros">📦 Outros</option>
            </select>
          </div>
        </form>
      </section>

      <section class="summary">
        <div><strong id="remaining">0</strong><span>pendentes</span></div>
        <div><strong id="total">0</strong><span>total</span></div>
        <div><strong id="progress">0%</strong><span>concluído</span></div>
      </section>

      <section id="emptyState" class="empty-state">
        <div class="empty-icon">🛒</div>
        <h2>Lista vazia</h2>
        <p>Adicione o primeiro item e a lista começa a tomar forma.</p>
      </section>

      <section id="list"></section>
    </main>

    <footer>
      <span>Feita para vocês dois</span>
      <span>•</span>
      <span>Nossa Lista ❤️</span>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
